<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punjab Organics</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Punjab Organics 🥛</h1>
    <p>Fresh Dairy Delivered to Your Doorstep</p>
</header>

<section class="hero">
    <h2>Pure & Organic Dairy Products</h2>
    <p>Healthy, fresh and directly from trusted farms</p>
</section>

<h2 class="title">Our Products</h2>

<div id="products" class="grid"></div>

<!-- WhatsApp Button -->
<div class="whatsapp">
    <a href="https://api.whatsapp.com/send?phone=916280022159&text=Hello%20Punjab%20Organics%2C%20I%20want%20to%20place%20an%20order">
        🟢 Order on WhatsApp
    </a>
</div>

<script>
const API_BASE = "https://punjab-organics.onrender.com";

async function getProducts() {
    try {
        const res = await fetch(`${API_BASE}/api/products`);
        const data = await res.json();

        const container = document.getElementById("products");

        container.innerHTML = data.map(p => `
            <div class="card">
                <h3>${p.name}</h3>
                <p>₹${p.price}</p>
            </div>
        `).join("");

    } catch (err) {
        document.getElementById("products").innerHTML =
            "<p style='color:red;'>Failed to load products</p>";
    }
}

getProducts();
</script>

</body>
</html>
